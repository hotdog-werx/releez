# generated by hotdogwerx-devkit-workspace@0.1.0 - manual changes may be overwritten
name: ci-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  repo-checks:
    uses: hotdog-werx/devkit/.github/workflows/__workspace_repo-checks.yaml@v0
    with:
      enable-docs: true

  python-checks:
    uses: hotdog-werx/devkit/.github/workflows/__python_python-checks.yaml@v0
    with:
      operating-systems: '["ubuntu-latest", "windows-latest"]'
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ## start-custom-ci-checks
  test-action:
    name: Test action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install mise tools
        uses: jdx/mise-action@v4
      - name: Install python dependencies
        run: mise run python:uv-sync
      - name: Create local branch for act (avoids detached HEAD warnings)
        run: git checkout -b ci-act-ref
      - name: Run action tests
        run: mise run test-action
  ## end-custom-ci-checks
