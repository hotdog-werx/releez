name: Start release

on:
  workflow_dispatch:
    inputs:
      version-override:
        description: 'Override version instead of computing via git-cliff (e.g. 1.2.3)'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Compute version and notes without changing the repo'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  start:
    name: Start release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Releez release start
        id: releez
        uses: ./
        with:
          mode: start
          version-override: ${{ inputs.version-override }}
          dry-run: ${{ inputs.dry-run }}
