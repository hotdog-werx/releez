[project]
name = "releez"
description = "CLI tool for helping to manage release processes."
readme = "README.md"
requires-python = ">=3.11"
version = "1.0.4"
license = "MIT"
authors = [{ name = "James Trousdale" }]
keywords = [
  "release",
  "versioning",
  "changelog",
  "git",
  "cli",
  "semver",
  "ci",
  "cd",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control",
]

dependencies = [
  "cyclopts ==4.11.0, <5",
  "rich ==15.0.0",
  "GitPython >= 3.1.45, <4",
  "PyGithub >= 2.8.1, <3",
  "git-cliff >=2.12.0, <3",
  "semver >=3.0.1, <4",
  "pydantic >=2.7.0, <3",
  "pydantic-settings >=2.7.0, <3",
  "tomli-w >=1.0.0, <2",
]

[dependency-groups]
dev = [
  "pytest >=9.0.2, <10",
  "pytest-cov >=7.0.0, <8",
  "pytest-mock >=3.15.1, <4",
]

[project.urls]
Homepage = "https://github.com/hotdog-werx/releez"
Repository = "https://github.com/hotdog-werx/releez"
"Bug Tracker" = "https://github.com/hotdog-werx/releez/issues"
Changelog = "https://github.com/hotdog-werx/releez/blob/master/CHANGELOG.md"

[project.scripts]
releez = "releez.cli:main"

# `extend` points at the whole-resources-directory symlink `repolish link`
# creates for every installed provider (populated on every `mise install`
# via the postinstall hook, no `repolish apply` required).
[tool.ruff]
extend = ".repolish/hotdogwerx-devkit-python/configs/ruff.toml"

# per-file-ignores lives here, not in the shared ruff.toml: ruff's `extend`
# resolves relative globs (like "**/tests/*.py") against the *extended*
# file's own directory, not this project's root, so they'd never match
# anything if they lived in the shared config.
[tool.ruff.lint.per-file-ignores]
# Tests still need a docstring (google-style, per [lint.pydocstyle] in the
# shared config) — D101/D102/D103 are deliberately NOT ignored here. Only
# the requirement to document every argument is loosened (D417); pydoclint
# skips tests entirely (see .repolish/hotdogwerx-devkit-python/configs/pydoclint.toml's
# exclude), since its signature/docstring arg-matching checks are stricter
# than ruff's.
"**/tests/*.py" = [
  "ANN001", # Allow untyped fixture arguments
  "ANN201", # Allow tests to not have a return type
  "ARG001", # Ignore unused arguments in tests - sometimes required for fixtures
  "D417", # Don't require documenting every argument in test docstrings
  "INP001", # Test dirs don't need __init__.py
  "S101", # Please sir may I use assert in my tests?
  "S701", # Jinja Environment() without autoescape is fine for non-HTML template tests
]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["tests"]
markers = [
  "slow: excluded from python:check:coverage by default; run directly (e.g. `pytest -m slow`) as its own CI step",
]

[tool.coverage.html]
directory = ".coverage-files/htmlcov"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if typing.TYPE_CHECKING:",
  "\\.\\.\\.",
]
show_missing = true

[tool.uv.build-backend]
module-name = "releez"
module-root = "src"

[tool.releez]
create-pr = true
alias-versions = "major"

[tool.releez.hooks]
post-changelog = [
  [
    "mise",
    "exec",
    "--",
    "mise",
    "run",
    "workspace:dprint:format",
    "{changelog}",
  ],
  [
    "uv",
    "version",
    "{version}",
  ],
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
